version: "2"
run:
  build-tags: [embedui]
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - noctx
    - revive
    - unconvert
    - usestdlibvars
  settings:
    revive:
      rules:
        # Doc comments where they say something, not on every exported name.
        - name: exported
          disabled: true
  exclusions:
    generated: strict
    presets: [std-error-handling]
    rules:
      # Tests close response bodies through t.Cleanup, which bodyclose can't follow.
      - path: _test\.go
        linters: [bodyclose]
formatters:
  enable: [gofmt, goimports]
  settings:
    goimports:
      local-prefixes: [github.com/spikebaylor/go-react-template]
