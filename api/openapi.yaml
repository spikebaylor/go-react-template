openapi: 3.0.3
info:
  title: go-react-template API
  version: "1"
  description: |
    The contract between the Go backend and the React frontend. Both sides are
    generated from this file (`just generate`); edit it first, then the code.
paths:
  /api/health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: The server is up and can reach its database.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/notes:
    get:
      operationId: listNotes
      responses:
        "200":
          description: Every note, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Note"
    post:
      operationId: createNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewNote"
      responses:
        "201":
          description: The created note.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          $ref: "#/components/responses/Problem"
  /api/notes/{id}:
    delete:
      operationId: deleteNote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Deleted.
        "404":
          $ref: "#/components/responses/Problem"
components:
  responses:
    Problem:
      description: The request could not be served.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          example: 1.3.0-dev.42
    Note:
      type: object
      required: [id, text, createdAt]
      properties:
        id:
          type: integer
          format: int64
        text:
          type: string
        createdAt:
          type: string
          format: date-time
    NewNote:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
    Problem:
      type: object
      required: [message]
      properties:
        message:
          type: string
