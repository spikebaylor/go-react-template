# Keeps the registry from filling with pre-release images. Releases are never
# touched: a tag that's also on a release only loses that tag, the image stays.
name: Clean up images

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: "17 4 * * 1" # weekly
  workflow_dispatch:
    inputs:
      pr:
        description: Delete this PR's images instead of pruning main builds (to redo a failed PR cleanup)
        type: number
        required: false

permissions:
  packages: write

jobs:
  cleanup:
    # A fork's PR never pushed images, and its token couldn't delete them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # One job per package, so GitHub refusing a deletion in one (it won't delete
    # some versions of public packages, and says so only when asked) leaves the
    # others cleaned.
    strategy:
      fail-fast: false
      matrix:
        suffix: ["", "-api", "-web"]
    concurrency:
      group: cleanup-images${{ matrix.suffix }}
    env:
      PR: ${{ github.event.pull_request.number || inputs.pr }}
    steps:
      - id: package
        run: |
          name=${GITHUB_REPOSITORY#*/}
          echo "name=${name,,}${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"

      - name: Delete the PR's images
        if: env.PR != ''
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          package: ${{ steps.package.outputs.name }}
          delete-tags: pr-${{ env.PR }},*-pr.${{ env.PR }}.*

      - name: Keep the 20 newest main builds
        if: env.PR == ''
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          package: ${{ steps.package.outputs.name }}
          use-regex: true
          # An image goes once all its tags do, so take each main build's sha- tag too.
          delete-tags: ^(\d+\.\d+\.\d+-dev\.\d+|sha-[0-9a-f]+)$
          keep-n-tagged: 20
          exclude-tags: ^(\d+\.\d+\.\d+|\d+\.\d+|latest|dev)$
          delete-untagged: true
