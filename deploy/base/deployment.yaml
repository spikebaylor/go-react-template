apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 1
  template:
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: app
          image: app # logical name: bound to a real image by the overlay
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-database
                  key: url
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
