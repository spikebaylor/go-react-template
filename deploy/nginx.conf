# The web image: static files, with client-side routes falling back to the app.
# /api/ is routed to the api image by whatever sits in front (an Ingress).
server {
    listen 8080;
    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
